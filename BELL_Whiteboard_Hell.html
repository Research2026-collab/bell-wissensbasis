<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BELL 2026 – Wissensbasis (hell)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface2: #eef2f6;
  --border: #e2e8f0;
  --navy: #1a4f8a;
  --text: #1a1a18;
  --text-muted: #6b6b67;
  --text-faint: #9a9a96;
  --blue: #2e6fc4;    --blue-light: #eef3fb;
  --green: #2E7D5A;   --green-light: #ebf5f0;
  --orange: #c05621;  --orange-light: #faf1e6;
  --purple: #6b46c1;  --purple-light: #f1ecf6;
  --pink: #b83280;    --pink-light: #fbe9ee;
  --teal: #2b7a78;    --teal-light: #e9f3f1;
  --gray: #767268;    --gray-light: #f0efe9;
  --radius: 10px;
  --radius-sm: 7px;
}
body {
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 1.5rem;
}
.top {
  display: flex; align-items: flex-start;
  justify-content: space-between; margin-bottom: 1.25rem;
  flex-wrap: wrap; gap: 0.75rem;
}
.top-left .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.35rem; }
.top-left h1 { font-size: 22px; font-weight: 800; color: var(--navy); margin-bottom: 0.25rem; }
.top-left p { font-size: 12px; color: var(--text-muted); }
.top-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.live-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.tabs-wrap { margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
.tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.tab {
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--text-muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 0.4rem 0.95rem; cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.tab:hover { color: var(--teal); border-color: var(--teal); }
.tab.active { color: #fff; background: var(--teal); border-color: var(--teal); font-weight: 700; }

/* Column layout for grouping tabs */
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1rem; align-items: start; }
.column { display: flex; flex-direction: column; gap: 0.65rem; }
.column-header {
  font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  padding: 0.55rem 0.85rem; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: space-between;
}
.column-header .count { font-size: 11px; font-weight: 500; opacity: 0.75; }

/* Single-item tabs: masonry-style grid */
.cards-grid { columns: 300px; gap: 0.75rem; }
.cards-grid .card { break-inside: avoid; margin-bottom: 0.75rem; }

/* Card base */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(26,26,24,0.07);
  transition: box-shadow 0.2s, transform 0.15s;
  animation: fadein 0.35s ease;
}
.card:hover { box-shadow: 0 4px 14px rgba(26,26,24,0.12); transform: translateY(-1px); }
@keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

.card-head {
  padding: 0.85rem 1rem 0.6rem;
  border-bottom: 1px solid var(--border);
}
.card-project { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 0.2rem; }
.card-meta { font-size: 11px; color: var(--text-faint); }
.card-body { padding: 0.75rem 1rem; font-size: 13px; line-height: 1.65; color: var(--text-muted); }
.card-contact {
  padding: 0.6rem 1rem;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-faint); line-height: 1.7;
}
.card-contact a { color: var(--teal); text-decoration: none; }
.card-contact a:hover { text-decoration: underline; }
.contact-hidden { font-size: 11px; color: var(--text-faint); padding: 0.5rem 1rem; border-top: 1px solid var(--border); font-style: italic; }

.tags { display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0 1rem 0.6rem; }
.tag { font-size: 10px; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 20px; letter-spacing: 0.03em; }

/* Column accent borders */
.col-blue   .card { border-left: 3px solid var(--blue); }
.col-green  .card { border-left: 3px solid var(--green); }
.col-orange .card { border-left: 3px solid var(--orange); }
.col-purple .card { border-left: 3px solid var(--purple); }
.col-pink   .card { border-left: 3px solid var(--pink); }
.col-teal   .card { border-left: 3px solid var(--teal); }
.col-gray   .card { border-left: 3px solid var(--gray); }

.col-blue   .column-header { background: var(--blue-light);   color: var(--blue); }
.col-green  .column-header { background: var(--green-light);  color: var(--green); }
.col-orange .column-header { background: var(--orange-light); color: var(--orange); }
.col-purple .column-header { background: var(--purple-light); color: var(--purple); }
.col-pink   .column-header { background: var(--pink-light);   color: var(--pink); }
.col-teal   .column-header { background: var(--teal-light);   color: var(--teal); }
.col-gray   .column-header { background: var(--gray-light);   color: var(--gray); }

/* Single-item tab accent */
.accent-green  .card { border-left: 3px solid var(--green); }
.accent-orange .card { border-left: 3px solid var(--orange); }
.accent-purple .card { border-left: 3px solid var(--purple); }
.accent-blue   .card { border-left: 3px solid var(--blue); }
.accent-pink   .card { border-left: 3px solid var(--pink); }
.accent-teal   .card { border-left: 3px solid var(--teal); }

.empty { text-align: center; color: var(--text-faint); padding: 4rem 0; font-size: 14px; }

/* Matching-Karten */
.m-bar { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.6rem; }
.m-bar select { font-family:inherit; font-size:13px; padding:.4rem .6rem; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); max-width:100%; }
.m-hint { font-size:12px; color:var(--text-faint); margin-bottom:1rem; max-width:80ch; line-height:1.6; }
.m-card { border-left:3px solid var(--teal); }
.m-single { columns:auto; max-width:680px; }
.m-eyebrow { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin-bottom:.2rem; }
.m-label { font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; }
.m-quote { font-style:italic; color:var(--text-muted); }
.m-list { list-style:none; display:flex; flex-direction:column; gap:.55rem; }
.m-partner { display:grid; grid-template-columns:1.6rem 1fr; gap:.5rem; background:var(--surface2); border-radius:var(--radius-sm); padding:.55rem .65rem; }
.m-nr { font-weight:800; color:var(--teal); font-size:15px; line-height:1.4; }
.m-name { font-weight:700; color:var(--navy); font-size:13px; }
.m-tags { display:flex; flex-wrap:wrap; gap:.25rem; margin:.25rem 0; }
.m-why { font-size:12px; line-height:1.55; color:var(--text-muted); margin-top:.2rem; }
.m-why b { color:var(--text); font-weight:600; }
.m-learn { list-style:none; display:flex; flex-direction:column; gap:.35rem; font-size:12px; }
.m-learn li { border-left:2px solid var(--orange); padding-left:.55rem; }
.m-learn b { color:var(--navy); }
.m-seek { color:var(--text-faint); }
.m-person { font-size:12px; color:var(--text); margin-top:.1rem; }
.m-card .card-head { position:relative; padding-right:3.6rem; }
.m-pdf { position:absolute; top:.8rem; right:.8rem; font:700 11px inherit; font-family:inherit; color:var(--teal); background:var(--teal-light); border:1px solid transparent; border-radius:20px; padding:.2rem .6rem; cursor:pointer; }
.m-pdf:hover { border-color:var(--teal); }
.m-actions { display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.4rem; }
.m-act { font-family:inherit; font-size:11px; font-weight:700; color:var(--navy); background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:.2rem .65rem; cursor:pointer; }
.m-act:hover { border-color:var(--navy); }
.m-hl { outline:3px solid var(--teal); outline-offset:3px; box-shadow:0 0 0 8px var(--teal-light) !important; }
.m-dialog { margin:auto; width:min(720px, calc(100vw - 32px)); max-height:85vh; overflow:auto; border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem 1.4rem; color:var(--text); background:var(--surface); box-shadow:0 20px 50px rgba(26,26,24,.25); }
.m-dialog::backdrop { background:rgba(26,26,24,.35); }
.m-dlg-head { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:.6rem; }
.m-dlg-body { margin-top:.9rem; font-size:13.5px; line-height:1.65; color:var(--text-muted); }
.m-dlg-body .m-label { margin-top:.9rem; }
.m-dlg-body p:not(.m-label) { white-space:pre-line; }
.m-status { font-size:12px; color:var(--text-muted); }
.m-stage { position:fixed; left:-10000px; top:0; width:720px; background:#fff; }
.m-stage .card { animation:none; transform:none; box-shadow:none; border:1px solid #d9dee5; border-left:3px solid var(--teal); }
.m-stage .m-pdf, .m-stage .m-actions { display:none; }
@media print {
  body { background:#fff; padding:0; }
  .top, .tabs-wrap, .m-bar, .m-hint, .m-pdf, .m-actions { display:none !important; }
  .m-grid { columns:auto !important; }
  .m-card { break-after:page; box-shadow:none; border:1px solid #ccc; border-left:3px solid var(--teal); animation:none; transform:none; }
  .m-card:last-child { break-after:auto; }
  .card-body { font-size:12.5px; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <p class="eyebrow">Jahreskonferenz BELL 2026 · Hannover · 16.–17. November 2026</p>
    <h1>Wissensbasis der Projekte</h1>
    <p>Gemeinsame Übersicht der teilnehmenden Projekte</p>
  </div>
  <div class="top-right">
    <div class="live-dot">
      <div class="dot"></div>
      <span id="livetext">Wird geladen…</span>
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="themen">Thematische Einordnung</button>
    <button class="tab" data-tab="zielgruppe">Zielgruppe</button>
    <button class="tab" data-tab="region">Region</button>
    <button class="tab" data-tab="stand">Programmlinie</button>
    <button class="tab" data-tab="fokus">Fokus</button>
    <button class="tab" data-tab="begeisterung">Was begeistert mich</button>
    <button class="tab" data-tab="veraenderung">Mehrwert bisher</button>
    <button class="tab" data-tab="veraenderungZiel">Wirkung am Projektende</button>
    <button class="tab" data-tab="gelingen">Gelingensfaktoren</button>
    <button class="tab" data-tab="hindernisse">Hemmende Faktoren</button>
    <button class="tab" data-tab="geheimtipp">Geheimtipps</button>
    <button class="tab" data-tab="suche">Wonach suche ich</button>
    <button class="tab" data-tab="biete">Was ich anbiete</button>
    <button class="tab" data-tab="matching">Matching-Karten</button>
    <button class="tab" data-tab="uebersicht">Übersicht</button>
    <button class="tab" data-tab="kontakte">Kontakte</button>
  </div>
</div>

<div id="board"></div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzt29vNU-riSrLsKJuORybtkdr5SnO9tJwDmzKnTwNXry45Qf9z4wQFf75Zq6p4EzR7VQ/exec';

let daten = [];
let letzterStand = '';
let activeTab = 'themen';

const THEMEN_DEF = [
  { name: 'Alle Themen/keine Festlegung',    color: 'blue'   },
  { name: 'Bildung fürs Engagement',         color: 'green'  },
  { name: 'Digitale Kompetenzentwicklung',   color: 'orange' },
  { name: 'Finanzbildung',                   color: 'purple' },
  { name: 'Gesundheitsbildung',              color: 'pink'   },
  { name: 'Kulturelle Bildung',              color: 'teal'   },
  { name: 'Politische Bildung',              color: 'gray'   },
  { name: 'Sprachenlernen Deutsch',          color: 'blue'   },
  { name: 'Umweltbildung / Nachhaltigkeit',  color: 'green'  },
  { name: 'Sonstiges',                       color: 'gray'   },
];
const ZG_DEF = [
  { name: 'Alle Älteren',                                                            color: 'blue'   },
  { name: 'Menschen mit Einwanderungsgeschichte',                                     color: 'green'  },
  { name: 'Ältere Beschäftigte',                                                      color: 'orange' },
  { name: 'Menschen mit Behinderung / Einschränkungen',                               color: 'purple' },
  { name: 'Ältere in institutionellen Wohnformen',                                    color: 'pink'   },
  { name: 'Ressourcenarme Ältere (geringe formale Bildung, geringes Einkommen, wenig Kontakte)', color: 'teal' },
  { name: 'Menschen im Übergang (in die Nachberuflichkeit)',                          color: 'gray'   },
  { name: 'Sonstiges',                                                                color: 'gray'   },
];
const PROGRAMMLINIE_LABELS = { AB: 'AB – allgemeine breite Projekte', BC: 'BC – Spezialprojekte' };
const COLOR_CYCLE = ['blue','green','orange','purple','pink','teal','gray'];

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  });
});

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function list(s) {
  return (s||'').split(',').map(v=>v.trim()).filter(Boolean);
}

// ── Card fragments ────────────────────────────────────────────────
function cardHead(e, hideRegion=false) {
  const standLabel = e.stand && PROGRAMMLINIE_LABELS[e.stand.trim()] ? PROGRAMMLINIE_LABELS[e.stand.trim()] : (e.stand || '');
  const stand = standLabel ? ` · ${esc(standLabel)}` : '';
  const meta = hideRegion
    ? (standLabel ? esc(standLabel) : '')
    : `${esc(e.region)||'Region nicht angegeben'}${stand}`;
  const geschlecht = e.geschlecht && e.geschlecht.trim() && e.geschlecht.trim() !== 'Offen für alle Geschlechter'
    ? `<span class="tag" style="background:var(--pink-light);color:var(--pink);margin-left:0.4rem;">${esc(e.geschlecht.trim())}</span>`
    : '';
  return `
    <div class="card-head">
      <p class="card-project">${esc(e.projekt)}${geschlecht}</p>
      ${meta ? `<p class="card-meta">${meta}</p>` : ''}
    </div>`;
}

function cardContact(e) {
  // Kontaktdaten erscheinen nur auf dem Kontakte-Tab, nicht auf inhaltlichen Karten
  return '';
}

function cardContactFull(e) {
  const persons = [
    [e.ap1Name, e.ap1Mail],
    [e.ap2Name, e.ap2Mail],
    [e.ap3Name, e.ap3Mail],
  ].filter(([n]) => n);
  if (!persons.length) return '<p style="font-size:12px;color:var(--text-faint);padding:0.5rem 1rem;">Keine Kontaktangaben</p>';
  const lines = persons.map(([n,m]) =>
    m ? `${esc(n)} · <a href="mailto:${esc(m)}">${esc(m)}</a>` : esc(n)
  ).join('<br>');
  return `<div class="card-contact">${lines}</div>`;
}

function makeCard(e, bodyHtml, tagHtml='', hideRegion=false) {
  return `
    <div class="card">
      ${cardHead(e, hideRegion)}
      ${tagHtml}
      <div class="card-body">${bodyHtml || '<span style="color:var(--text-faint)">Keine Angabe</span>'}</div>
      ${cardContact(e)}
    </div>`;
}

// ── Grouping columns ──────────────────────────────────────────────
function renderColumns(board, defs, keyFn, cardBodyFn, hideRegion=false) {
  board.innerHTML = `<div class="columns">${
    defs.map(def => {
      const matches = daten.filter(e => keyFn(e, def));
      return `
        <div class="column col-${def.color}">
          <div class="column-header">
            <span>${esc(def.name)}</span>
            <span class="count">${matches.length}</span>
          </div>
          ${matches.length
            ? matches.map(e => makeCard(e, cardBodyFn(e), '', hideRegion)).join('')
            : `<p class="empty" style="padding:1.5rem 0;">Keine Einträge</p>`}
        </div>`;
    }).join('')
  }</div>`;
}

// ── Single-item tab ────────────────────────────────────────────────
function renderSingle(board, key, label, accent) {
  const items = daten.filter(e => e[key] && e[key].trim());
  if (!items.length) {
    board.innerHTML = `<p class="empty">Noch keine Einträge für „${label}".</p>`;
    return;
  }
  board.innerHTML = `<div class="cards-grid accent-${accent}">${
    items.map(e => makeCard(e, esc(e[key]))).join('')
  }</div>`;
}

// ── Tab renderers ──────────────────────────────────────────────────
function render() {
  const board = document.getElementById('board');
  if (!daten.length) {
    board.innerHTML = `<p class="empty">Noch keine Projektangaben eingegangen.</p>`;
    return;
  }

  if (activeTab === 'themen') {
    renderColumns(board, THEMEN_DEF,
      (e, def) => list(e.themen).includes(def.name),
      e => esc(e.fokus)
    );
    return;
  }

  if (activeTab === 'zielgruppe') {
    renderColumns(board, ZG_DEF,
      (e, def) => list(e.zielgruppe).includes(def.name),
      e => esc(e.fokus)
    );
    return;
  }

  if (activeTab === 'region') {
    const regionen = {};
    daten.forEach(e => {
      const r = e.region && e.region.trim() ? e.region.trim() : 'Ohne Angabe';
      (regionen[r] = regionen[r]||[]).push(e);
    });
    const namen = Object.keys(regionen).sort((a,b) =>
      a==='Ohne Angabe'?1:b==='Ohne Angabe'?-1:a.localeCompare(b,'de'));
    const defs = namen.map((r,i) => ({ name: r, color: COLOR_CYCLE[i%COLOR_CYCLE.length], _key: r }));
    renderColumns(board, defs,
      (e, def) => (e.region&&e.region.trim()?e.region.trim():'Ohne Angabe') === def.name,
      e => esc(e.fokus),
      true
    );
    return;
  }

  if (activeTab === 'stand') {
    const defs = [
      { name: PROGRAMMLINIE_LABELS.AB, color: 'blue',   code: 'AB' },
      { name: PROGRAMMLINIE_LABELS.BC, color: 'orange', code: 'BC' },
      { name: 'Ohne Angabe', color: 'gray', code: null },
    ];
    renderColumns(board, defs,
      (e, def) => {
        const raw = e.stand && e.stand.trim() ? e.stand.trim() : null;
        const s = (raw === 'AB' || raw === 'BC') ? raw : null;
        return s === def.code;
      },
      e => esc(e.fokus)
    );
    return;
  }

  if (activeTab === 'fokus')        { renderSingle(board, 'fokus',        'Fokus',              'blue');   return; }
  if (activeTab === 'begeisterung') { renderSingle(board, 'begeisterung', 'Was begeistert mich', 'teal');   return; }
  if (activeTab === 'veraenderung') { renderSingle(board, 'veraenderung', 'Mehrwert bisher',     'pink');   return; }
  if (activeTab === 'veraenderungZiel') { renderSingle(board, 'veraenderungZiel', 'Wirkung am Projektende', 'blue'); return; }
  if (activeTab === 'gelingen')     { renderSingle(board, 'gelingen',     'Gelingensfaktoren',  'green');  return; }
  if (activeTab === 'hindernisse') { renderSingle(board, 'hindernisse','Hemmende Faktoren',  'orange'); return; }
  if (activeTab === 'geheimtipp')  { renderSingle(board, 'geheimtipp', 'Geheimtipps',           'purple'); return; }
  if (activeTab === 'suche')       { renderSingle(board, 'suche',      'Wonach suche ich',      'teal');   return; }
  if (activeTab === 'biete')       { renderSingle(board, 'biete',      'Was ich anbiete',       'pink');   return; }

  if (activeTab === 'matching')    { renderMatching(board); return; }

  if (activeTab === 'uebersicht') {
    const cards = daten.map(e => {
      const themen = list(e.themen).map(t => t==='Sonstiges'&&e.themenSonstiges?e.themenSonstiges:t);
      const zg     = list(e.zielgruppe).map(z => z==='Sonstiges'&&e.zielgruppeSonstiges?e.zielgruppeSonstiges:z);
      const col = (THEMEN_DEF.find(t => list(e.themen).includes(t.name)) || {color:'gray'}).color;
      const tagHtml = themen.length
        ? `<div class="tags">${themen.map(t=>`<span class="tag" style="background:var(--${col}-light);color:var(--${col})">${esc(t)}</span>`).join('')}</div>`
        : '';
      const zgLine = zg.length ? `<p style="font-size:12px;color:var(--text-faint);margin-top:0.3rem;">Zielgruppe: ${esc(zg.join(', '))}</p>` : '';
      const body = [
        e.fokus       ? `<p><strong style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em">Fokus</strong><br>${esc(e.fokus)}</p>` : '',

  if (activeTab === 'kontakte') {

    board.innerHTML = hint + `<div class="cards-grid">${cards}</div>`;
    mHighlight();

  }
}

// Verbindet, was ein Projekt sucht, mit dem, was andere anbieten.
// Berechnung im Browser aus den Live-Daten, ohne Kontaktdaten.
const M_CATS = {
  'Zielgruppen erreichen': /erreich|zugang|zugangsweg|ansprache|teilnehmer\w*gewinn|teilnehmendengewinn|akquise|hemmschwelle|hürde|gewinnung von teilnehm|gewonnen werden|motivation|aktivierung|misstrauen|vertrauen|neugierig auf/g,

  'Ländlicher Raum': /ländlich|auf dem land|flächenregion/g,
  'Formate & Methoden': /format|methode|didaktik|workshop|kreativ|best.practice|good-practice|praxisbeispiel|konzept|peer|train-the-trainer|qualifizierung|themenvorschläge|bildungsfahrt/g,
  'Verwaltung & ESF-Nachweise': /administ|bürokrat|zeus|esf|eintritts|dokumentation|fragebög|qualitätssicherung/g,
  'Materialien': /material|unterlagen|toolbox|leitfäden|ressourcen|aufzeichnungen/g,
  'Gesundheit & Bewegung': /gesundheit|bewegung|erste-hilfe|ernährung/g,
  'Politische Bildung': /politisch|demokratie|radikalis/g,
  'Mobile & aufsuchende Angebote': /mobil|aufsuchend|workshopmobil|senior\w*bus/g,
};
const M_ZG = {
  'Menschen im Übergang': 'Übergang in den Ruhestand',
  'Menschen mit Einwanderungsgeschichte': 'Einwanderungsgeschichte',
  'Ressourcenarme Ältere': 'Ressourcenarme Ältere',
  'Menschen mit Behinderung': 'Behinderung / Einschränkungen',
  'Ältere in institutionellen Wohnformen': 'Institutionelle Wohnformen',
  'Ältere Beschäftigte': 'Ältere Beschäftigte',
};
// Zielgruppen, die im Suche-Text oder im Angebot ausdrücklich genannt werden
const M_ZG_TEXT = {
  'Einwanderungsgeschichte': /migration|einwanderung|interkultur|mehrsprach|postmigrant/,
  'Behinderung / Einschränkungen': /behinder|einschränkung|beeinträchtig|blind|inklusi/,
  'Ressourcenarme Ältere': /bildungsfern|ressourcenarm|vereinsamt|einsam|armut|geringem einkommen/,
  'Übergang in den Ruhestand': /übergang in den ruhestand|ruhestand|nachberuf|weiterarbeit|boomer/,
  'Institutionelle Wohnformen': /senior\S*\s?einrichtung|pflegeeinrichtung|pflegeheim|altenheim|wohnform|bewohner/,
};
const M_STOP = new Set(('aber alle allem als also am an auch auf aus bei bin bis da damit dann das dass dem den der des die dies diese dieser dir doch durch ein eine einem einen einer es für gibt hat haben ich ihr im in ist ja kann können mit nach nicht noch nur oder sich sie sind so über um und uns unser unsere unserer unseren von vor wie wir wird wo zu zum zur zwischen besonders gerne gern sowie etwa andere anderen anderer projekt projekte projekten projekts menschen ältere älteren älterer erfahrungen erfahrung austausch interessant bieten suchen gut sehr viele mehr werden wurde einen jahren dazu außerdem welche konnten innen bereich zielgruppe zielgruppen arbeit bildung ideen hinweise darüber hinaus aktiv dabei insbesondere').split(' '));
const M_EMPTY = /Aufbauphase befinden, lassen sich momentan keine Aussagen/i;
let mCache = { key: '', P: [] };
let mSel = '';

function mText(t) { t = (t || '').toString().trim(); return M_EMPTY.test(t) ? '' : t; }
function mCats(t) { const l = (t || '').toLowerCase(); return t ? Object.keys(M_CATS).filter(k => l.search(new RegExp(M_CATS[k].source)) >= 0) : []; }
function mRegion(r) { r = (r || '').trim(); return r && r === r.toUpperCase() ? r.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()) : r; }
function mSents(t) {
  t = t.replace(/z\.\s?B\./g, 'z.B.').replace(/u\.\s?a\./g, 'u.a.');
  return t.split(/(?<=[.!?])\s+|\n+|\s-\s|\s\d\.\s/).map(s => s.trim().replace(/^[-•\s]+/, '')).filter(s => s.length > 12);
}
function mBest(t, cats, terms) {
  if (!t) return '';
  const parts = cats.map(c => M_CATS[c].source).concat((terms || []).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
  if (!parts.length) return '';
  const re = new RegExp(parts.join('|'), 'g');
  let best = null;
  mSents(t).forEach(s => {
    const n = (s.toLowerCase().match(re) || []).length;
    if (!n) return;
    const sc = [n, -Math.abs(s.length - 140)];
    if (!best || sc[0] > best.sc[0] || (sc[0] === best.sc[0] && sc[1] > best.sc[1])) best = { sc, s };
  });
  if (!best) return '';
  let s = best.s;
  if (s.length <= 240) return s;
  const i = s.toLowerCase().search(new RegExp(parts.join('|')));
  const st = Math.max(0, i - 90), en = Math.min(s.length, st + 230);
  let f = s.slice(st, en);
  if (st > 0) f = '… ' + f.slice(f.indexOf(' ') + 1);
  if (en < s.length) f = f.slice(0, f.lastIndexOf(' ')) + ' …';
  return f;
}
function mTokens(t) { return ((t || '').toLowerCase().match(/[a-zäöüß][a-zäöüß-]{3,}/g) || []).filter(w => !M_STOP.has(w)); }

function mCompute() {
  // Dubletten je Projektnummer: Eintrag mit Suche/Biete und Zeitstempel bevorzugen
  const byNr = {};
  daten.forEach(e => {
    if (!e.projekt || /^Name Projekt$/i.test(e.projekt.trim())) return;
    const nr = (e.projektnummer || e.projekt).toString().trim();
    const rank = (mText(e.suche) || mText(e.biete) ? 2 : 0) + (e.zeitstempel ? 1 : 0);
    const ok = (e.einverstaendnisKontakt || '').trim().toLowerCase() === 'ja';
    const names = ok ? [e.ap1Name, e.ap2Name, e.ap3Name].map(n => (n || '').trim()).filter(Boolean) : [];
    const prev = byNr[nr];
    const ap = names.length ? names : (prev ? prev.ap : []);
    if (!prev || rank > prev.rank) byNr[nr] = { e, rank, ap };
    else if (!prev.ap.length && names.length) prev.ap = names;
  });
  const P = Object.entries(byNr).map(([nr, { e, ap }]) => {
    const s = mText(e.suche), b = mText(e.biete), f = mText(e.fokus).replace(/\s+/g, ' ');
    const B = mCats(b);
    return {
      id: nr, ap, p: e.projekt.replace(/\s+/g, ' ').trim().replace(/^["„“]+|["„“]+$/g, ''), r: mRegion(e.region),
      s, b, f, S: mCats(s), B, F: mCats(f).filter(c => !B.includes(c)),
      zg: Object.keys(M_ZG).filter(k => (e.zielgruppe || '').includes(k)).map(k => M_ZG[k]),
    };
  });
  // Gewichte: seltene Angebote zählen mehr
  const W = {};
  Object.keys(M_CATS).forEach(c => { const n = P.filter(p => p.B.includes(c)).length; W[c] = n ? 1 / Math.sqrt(n) : 0; });
  // TF-IDF: Suche-Text gegen Angebot (doppelt) und Projektbeschreibung
  const docA = P.map(p => mTokens(p.s)), docB = P.map(p => mTokens(p.b + ' ' + p.b + ' ' + p.f));
  const df = {}; const all = docA.concat(docB);
  all.forEach(d => new Set(d).forEach(w => df[w] = (df[w] || 0) + 1));
  const N = all.length;
  const vec = d => { const tf = {}; d.forEach(w => tf[w] = (tf[w] || 0) + 1); let n = 0; const v = {};
    Object.keys(tf).forEach(w => { v[w] = (1 + Math.log(tf[w])) * (Math.log((1 + N) / (1 + df[w])) + 1); n += v[w] * v[w]; });
    n = Math.sqrt(n) || 1; Object.keys(v).forEach(w => v[w] /= n); return v; };
  const VA = docA.map(vec), VB = docB.map(vec);
  P.forEach((a, i) => {
    if (!a.s) { a.M = []; return; }
    const L = [];
    P.forEach((b, j) => {
      if (i === j) return;
      const m = a.S.filter(c => b.B.includes(c));
      const mf = a.S.filter(c => b.F.includes(c) && !m.includes(c));
      const zgm = a.zg.filter(z => b.zg.includes(z));
      let cos = 0; const prod = [];
      Object.keys(VA[i]).forEach(w => { if (VB[j][w]) { const x = VA[i][w] * VB[j][w]; cos += x; prod.push([x, w]); } });
      // Zielgruppe: gesucht (im Text oder eigene Zielgruppe bei „Zielgruppen erreichen“) und beim Partner vorhanden
      const want = Object.keys(M_ZG_TEXT).filter(z => M_ZG_TEXT[z].test(a.s.toLowerCase()) || (a.S.includes('Zielgruppen erreichen') && a.zg.includes(z)));
      const bText = (b.b + ' ' + b.f).toLowerCase();
      const zgHit = want.filter(z => M_ZG_TEXT[z].test(bText));
      const zgExpert = want.filter(z => M_ZG_TEXT[z].test(b.b.toLowerCase()));
      let sc = m.reduce((s, c) => s + W[c], 0) + 0.5 * mf.reduce((s, c) => s + (W[c] || 0.5), 0)
        + Math.min(0.3, 0.15 * zgm.length) + 0.35 * zgHit.length + 0.5 * zgExpert.length
        + 3 * cos + (b.r && a.s.includes(b.r) ? 0.8 : 0) + (b.r === a.r ? 0.1 : 0);
      if (!b.b && !m.length && !mf.length && !zgHit.length) sc *= 0.6;
      // nur allgemeine Felder ohne Text- oder Zielgruppenbezug: abwerten
      const generic = ['Formate & Methoden', 'Zielgruppen erreichen', 'Netzwerke & Kooperationen'];
      if (m.concat(mf).every(c => generic.includes(c)) && cos < 0.08 && !zgHit.length) sc *= 0.75;
      if (sc < 0.35) return;
      zgm.push(...zgHit.filter(z => !zgm.includes(z)));
      const terms = prod.sort((x, y) => y[0] - x[0]).slice(0, 4).map(x => x[1]);
      L.push({ j, sc, m, mf, zg: zgm, sa: mBest(a.s, m, terms), sb: mBest(b.b, m, terms), sf: mf.length ? mBest(b.f, mf) : '', same: b.r === a.r });
    });
    // Auswahl nacheinander: bereits abgedeckte Anliegen zählen beim nächsten Vorschlag weniger,
    // damit jedes Anliegen eines Projekts einen passenden Partner bekommt
    const pick = [], covered = new Set();
    while (pick.length < 4 && L.length) {
      L.forEach(x => x.adj = x.sc - 0.6 * x.m.concat(x.mf).filter(c => covered.has(c)).reduce((s, c) => s + (W[c] || 0.3), 0));  // abgedeckt = ausdrücklich angeboten
      L.sort((x, y) => y.adj - x.adj || y.same - x.same);
      const x = L.shift();
      if (pick.length >= 2 && x.adj < 0.3 * pick[0].sc) break;   // lieber weniger als schwache Vorschläge
      pick.push(x); x.m.forEach(c => covered.add(c));
    }
    a.M = pick;
  });
  P.forEach((b, j) => { b.R = []; P.forEach((a, i) => a.M.forEach(x => { if (x.j === j) b.R.push({ i, m: x.m, sc: x.sc }); })); b.R.sort((x, y) => y.sc - x.sc); });
  return P;
}

function renderMatching(board) {
  if (mCache.key !== letzterStand) mCache = { key: letzterStand, P: mCompute() };
  const P = mCache.P;
  const withCards = P.map((p, i) => ({ p, i })).filter(({ p }) => p.M.length || p.R.length)
    .sort((x, y) => x.p.p.localeCompare(y.p.p, 'de'));

  const shown = mSel === '' ? withCards : withCards.filter(({ i }) => String(i) === mSel);

    return `<div class="card m-card" data-card="${i}">
      <div class="card-head"><p class="m-eyebrow">Matching-Karte</p><p class="card-project">${esc(p.p)}</p><p class="card-meta">${esc(p.r) || 'Region nicht angegeben'}${p.ap.length ? ' · ' + esc(p.ap.join(', ')) : ''}</p>
      <button type="button" class="m-pdf" data-pdf="${i}" title="Diese Karte als PDF herunterladen">PDF</button></div>
      <div class="card-body">
        ${p.s ? `<p class="m-label">Ihr sucht</p><p class="m-quote">${esc(p.s.length > 380 ? p.s.slice(0, 380).replace(/\s\S*$/, '') + ' …' : p.s)}</p>` : ''}
        ${partners ? `<p class="m-label" style="margin-top:.8rem">Eure Gesprächspartner</p><ol class="m-list">${partners}</ol>` : ''}
        ${learn ? `<p class="m-label" style="margin-top:.8rem">Diese Projekte möchten von euch lernen</p><ul class="m-learn">${learn}</ul>` : ''}
      </div></div>`;
  };
  board.innerHTML = `
    <div class="m-bar">
      <label for="mSel" class="m-label" style="margin:0">Karte für</label>
      <select id="mSel"><option value="">Alle Projekte (${withCards.length})</option>${opts}</select>
      <button type="button" class="tab" id="mPdfAll">${mSel === '' ? 'Alle Karten als PDF' : 'Karte als PDF'}</button>
      <button type="button" class="tab" id="mPrint">Drucken</button>
      <span class="m-status" id="mStatus" aria-live="polite"></span>
    </div>
    <p class="m-hint">Die Vorschläge verbinden, was ein Projekt sucht, mit dem, was andere anbieten oder laut Projektbeschreibung tun, und berücksichtigen gemeinsame Zielgruppen. Seltene Anliegen zählen stärker als allgemeine.${ohne ? ` ${ohne} Projekte haben Suche und Biete noch nicht ausgefüllt und erhalten deshalb keine eigene Karte.` : ''}</p>
    <div class="cards-grid m-grid${mSel !== '' ? ' m-single' : ''}">${shown.map(card).join('') || '<p class="empty">Noch keine Suche- und Biete-Angaben für ein Matching.</p>'}</div>`;
  document.getElementById('mSel').onchange = ev => { mSel = ev.target.value; render(); };
  document.getElementById('mPrint').onclick = () => window.print();
  mLibs().catch(() => {});
  document.getElementById('mPdfAll').onclick = () => mPdf(shown.map(x => x.i), mSel === '' ? 'BELL_Matching-Karten' : 'Matching-Karte_' + P[+mSel].p);
  board.querySelectorAll('[data-go]').forEach(b => b.onclick = () => mGoto(b.dataset.go, b.dataset.nr));
  board.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => mPdf([+b.dataset.pdf], 'Matching-Karte_' + P[+b.dataset.pdf].p));
}

function mShowProject(nr) {

    <div class="m-dlg-head">
      <div><p class="m-eyebrow">Projekt</p><p class="card-project" style="font-size:17px">${esc(e.projekt)}</p>
      <p class="card-meta">${esc(mRegion(e.region)) || 'Region nicht angegeben'}</p></div>
      <button type="button" class="m-act" id="mDlgClose">Schließen</button>
    </div>
    ${themen.length ? `<div class="tags" style="padding:0">${themen.map(t => `<span class="tag" style="background:var(--teal-light);color:var(--teal)">${esc(t)}</span>`).join('')}</div>` : ''}
    ${zg.length ? `<p class="card-meta" style="margin-top:.4rem">Zielgruppe: ${esc(zg.join(', '))}</p>` : ''}
    <div class="m-dlg-body">${F.filter(([k]) => e[k] && e[k].toString().trim()).map(([k, l]) => `<p class="m-label">${l}</p><p>${esc(e[k].toString())}</p>`).join('')}</div>
    ${ok ? `<div class="m-actions" style="margin-top:1rem"><button type="button" class="m-act" id="mDlgKontakt">Kontakt ansehen</button></div>` : ''}`;
  dlg.querySelector('#mDlgClose').onclick = () => dlg.close();
  const k = dlg.querySelector('#mDlgKontakt'); if (k) k.onclick = () => { dlg.close(); mGoto('kontakte', nr); };
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  dlg.scrollTop = 0;
}

function mGoto(tab, nr) {
  if (tab === 'uebersicht') { mShowProject(nr); return; }
  mFocus = nr;
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  activeTab = tab; render();
}
function mHighlight() {
  if (!mFocus) return;
  const els = [...document.querySelectorAll(`#board [data-nr="${CSS.escape(mFocus)}"]`)];
  mFocus = '';
  const el = els.find(x => x.dataset.rich === '1') || els[0];
  if (!el) return;
  el.classList.add('m-hl');
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 120 });
  setTimeout(() => el.classList.remove('m-hl'), 4000);
}

function mLoad(src) {
  return new Promise((ok, fail) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
    const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
}
// PDF-Bibliotheken liegen im Repository; cdnjs nur als Reserve
const M_LIBS = [
  ['html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => window.html2canvas],
  ['jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => window.jspdf],
];
let mLibsPromise = null;
function mLibs() {
  if (!mLibsPromise) mLibsPromise = (async () => {
    for (const [local, cdn, ready] of M_LIBS) {
      if (ready()) continue;
      try { await mLoad(local); } catch (e) { await mLoad(cdn); }
    }
  })().catch(e => { mLibsPromise = null; throw e; });
  return mLibsPromise;
}
let mBusy = false;
async function mPdf(ids, name) {
  if (mBusy) return; mBusy = true;
  const st = document.getElementById('mStatus'); const say = t => { if (st) st.textContent = t; };
  try {
    say('PDF wird vorbereitet …');
    await mLibs();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pw = 210, ph = 297, mg = 12;
    const stage = document.createElement('div');
    stage.className = 'm-stage';
    document.body.appendChild(stage);
    for (let k = 0; k < ids.length; k++) {
      say(`PDF wird erstellt … ${k + 1} von ${ids.length}`);
      const src = document.querySelector(`[data-card="${ids[k]}"]`);
      if (!src) continue;
      stage.innerHTML = ''; const c = src.cloneNode(true); stage.appendChild(c);
      const canvas = await html2canvas(c, { scale: 1.6, backgroundColor: '#ffffff', logging: false });
      let w = pw - 2 * mg, h = canvas.height * w / canvas.width;
      if (h > ph - 2 * mg) { h = ph - 2 * mg; w = canvas.width * h / canvas.height; }
      if (k > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.8), 'JPEG', (pw - w) / 2, mg, w, h);
    }
    stage.remove();
    pdf.save(name.replace(/[^\wÄÖÜäöüß\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 80) + '.pdf');
    say('PDF heruntergeladen');
    setTimeout(() => say(''), 4000);
  } catch (err) {
    say('PDF konnte nicht erstellt werden. Bitte „Drucken“ und dann „Als PDF speichern“ wählen.');
  } finally { mBusy = false; }
}

async function laden() {
  try {
    const res = await fetch(SHEET_URL + '?t=' + Date.now());
    const neu = await res.json();
    const neuJson = JSON.stringify(neu);
    const now = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (neuJson !== letzterStand) {
      letzterStand = neuJson;
      daten = neu;
      render();
    }
    document.getElementById('livetext').textContent =
      `Zuletzt gepr\u00FCft: ${now} \u00B7 ${daten.length} Projekt${daten.length!==1?'e':''}`;
  } catch(e) {
    document.getElementById('livetext').textContent = 'Verbindungsfehler';
  }
}

laden();
setInterval(laden, 15000);
</script>
